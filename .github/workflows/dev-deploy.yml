name: Deploy to Develop EC2
on:
  push:
    branches: ["refactoring-1"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module:
          - name: daengle-payment
            path: daengle-payment-api
          - name: daengle-user
            path: daengle-user-api
          - name: daengle-vet
            path: daengle-vet-api
          - name: daengle-groomer
            path: daengle-groomer-api
          - name: daengle-chat
            path: daengle-chat-api
      max-parallel: 1

    env:
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 변경된 파일 확인
      - name: Get modified files
        id: git_diff
        run: |
          echo "변경된 파일을 확인하는 중..."
          MODIFIED_FILES=$(git diff --name-only HEAD~1 HEAD | sort -u)
          echo "변경된 파일: $MODIFIED_FILES"
          echo "MODIFIED_FILES=$MODIFIED_FILES" >> $GITHUB_ENV

      # 3. 변경된 모듈 확인
      - name: Determine changed modules
        id: determine_modules
        run: |
          CHANGED_MODULES=()
          for module in $MODIFIED_FILES; do
            for item in "${{ matrix.module }}"; do
              if [[ $module == *"${item.path}"* ]]; then
                CHANGED_MODULES+=("${item.name}")
              fi
            done
          done
          echo "변경된 모듈: ${CHANGED_MODULES[@]}"
          echo "CHANGED_MODULES=${CHANGED_MODULES[@]}" >> $GITHUB_ENV

      # 4. application.yml 생성
      - name: Create application.yml
        run: |
          mkdir -p ${{ matrix.module.path }}/src/main/resources
          echo "${{ secrets.APPLICATION_YML_TEST }}" > ${{ matrix.module.path }}/src/main/resources/application.yml

      # 5. .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > ${{ matrix.module.path }}/.env

      # 6. JDK 설정 및 빌드
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR with Gradle
        run: |
          ./gradlew clean :${{ matrix.module.path }}:build -x test

      # 7. 빌드 결과 확인
      - name: Verify Build Output
        run: ls -lh ${{ matrix.module.path }}/build/libs

      # 8. Docker 빌드 및 푸시 (로그만 출력)
      - name: Log Docker Build and Push
        run: |
          echo "변경된 모듈 확인 중..."
          echo "변경된 모듈: ${CHANGED_MODULES[@]}"
          echo "실제 Docker 빌드 및 푸시 작업은 건너뜁니다."

      # 9. SSH 설정 (로그만 출력)
      - name: Log SSH Setup
        run: |
          echo "SSH 설정 로그: 해당 작업은 건너뜁니다."

      # 10. EC2 호스트 출력 (로그만 출력)
      - name: Log EC2 Host
        run: |
          echo "EC2 호스트 정보 출력 (실제 배포는 하지 않음)"
          echo "변경된 모듈에 해당하는 EC2 호스트 정보는 추적됩니다만, 실제 배포 작업은 수행되지 않습니다."

      # 11. EC2 배포 (로그만 출력)
      - name: Log EC2 Deployment
        run: |
          echo "EC2 배포 작업 로그 출력 (실제 배포는 하지 않음)"
